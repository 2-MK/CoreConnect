<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Achievement</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            background:#f4f6f9;
            padding:40px;

        }

        .container{

            width:100%;
            max-width:800px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);

        }

        h1{

            color:#2c3e50;
            margin-bottom:10px;

        }

        p{

            color:#666;
            margin-bottom:25px;

        }

        form{

            display:grid;
            gap:18px;

        }

        label{

            font-weight:bold;
            color:#444;
            margin-bottom:5px;
            display:block;

        }

        input,
        textarea{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        textarea{

            min-height:120px;
            resize:vertical;

        }

        input[type=file]{

            padding:10px;

        }

        .btn{

            background:#2ecc71;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:.3s;

        }

        .btn:hover{

            background:#27ae60;

        }

        .back{

            display:inline-block;
            margin-top:20px;
            background:#3498db;
            color:white;
            text-decoration:none;
            padding:12px 20px;
            border-radius:8px;

        }

        .back:hover{

            background:#2980b9;

        }

    </style>

</head>
<body>

<div class="container">

    <h1>Placement Achievement</h1>

    <p>Add a student's placement details.</p>

    {% if success_message %}
        <p style="color: #2ecc71; font-weight: bold;">{{ success_message }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" action="{% url 'placement_updates' %}">

        {% csrf_token %}

        <!-- Student Name -->

        <div>

            <label>Student Name</label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter student name"
                required>

        </div>

        <!-- Company -->

        <div>

            <label>Company Name</label>

            <input
                type="text"
                name="company_name"
                placeholder="Enter company name"
                required>

        </div>

        <!-- Job Role -->

        <div>

            <label>Job Role</label>

            <input
                type="text"
                name="job_role"
                placeholder="Software Engineer"
                required>

        </div>

        <!-- Package -->

        <div>

            <label>Package (LPA)</label>

            <input
                type="number"
                step="0.01"
                name="package_lpa"
                placeholder="6.50">

        </div>

        <!-- Placement Date -->

        <div>

            <label>Placement Date</label>

            <input
                type="date"
                name="placement_date">

        </div>

        <!-- Caption -->

        <div>

            <label>Caption</label>

            <textarea
                name="caption"
                placeholder="Write a short placement achievement..."></textarea>

        </div>

        <!-- Image -->

        <div>

            <label>Student Image</label>

            <input
                type="file"
                name="achievement_image"
                accept="image/*"
                required>

        </div>

        <button class="btn" type="submit">

            Save Achievement

        </button>

    </form>

    <a href="{% url 'placement_management' %}" class="back">

        Back

    </a>

</div>

</body>
</html>
