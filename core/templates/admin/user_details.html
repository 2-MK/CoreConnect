<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #eef2f7;
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .main {
            display: flex;
            gap: 20px;
        }

        .left-panel {
            width: 40%;
        }

        .right-panel {
            width: 60%;
        }

        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0,0,0,.15);
        }

        .card-header {
            font-weight: bold;
        }

        .btn {
            width: 100%;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btns button {
            width: 100%;
        }

        input {
            margin-bottom: 10px;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    USER MANAGEMENT
</div>

<div class="container">
    <div class="main">

        <!-- ================= LEFT PANEL ================= -->
        <div class="left-panel">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    Add New User
                </div>
                <div class="card-body">
                    <form id="userForm">
                        <input type="text" class="form-control" id="ktu_id" placeholder="KTU ID" required>
                        <input type="text" class="form-control" id="name" placeholder="Full Name" required>
                        
                        <select class="form-control mb-2" id="passout_year">
                            <option value="">Select Passout Year</option>
                            <option>2020-2024</option>
                            <option>2021-2025</option>
                            <option>2022-2026</option>
                            <option>2023-2027</option>
                            <option>2024-2028</option>
                            <option>2025-2029</option>
                        </select>
                        
                        <input type="email" class="form-control" id="email" placeholder="Personal Email" required>
                        <input type="email" class="form-control" id="ritemail" placeholder="RIT Email">
                        <input type="text" class="form-control" id="contact" placeholder="Contact Number">
                        
                        <button type="submit" class="btn btn-success">
                            Add User
                        </button>
                    </form>
                    <div id="message"></div>
                </div>
            </div>

           <div class="d-flex gap-3 mt-4">

    <!-- Download Password Page -->
        <div class="card flex-fill shadow-sm">
            <div class="card-header bg-info text-white text-center py-2" style="font-size: 14px;">
                Student Manage
            </div>
            <div class="card-body p-3 text-center">
                <a href="{% url 'student_manage' %}" class="btn btn-sm btn-outline-info w-100">
                    Manage
                </a>
            </div>
        </div>

        <!-- Alumni Approval Page -->
        <div class="card flex-fill shadow-sm">
            <div class="card-header bg-warning text-dark text-center py-2" style="font-size: 14px;">
                Alumni Approval
            </div>
            <div class="card-body p-3 text-center">
                <a href="{% url 'alumni_approval' %}" class="btn btn-sm btn-outline-warning w-100 text-dark">
                    Review Requests
                </a>
            </div>
        </div>

    </div>
        </div>

        <!-- ================= RIGHT PANEL ================= -->
        <div class="right-panel">
            <div class="card">
                <div class="card-header bg-success text-white">
                    Manage User
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" id="searchKTU" class="form-control" placeholder="Search by KTU ID">
                        <button class="btn btn-primary" style="width: auto;" onclick="searchUser()">Search</button>
                    </div>
                    <hr>
                    <input class="form-control" id="edit_ktu" readonly placeholder="KTU ID">
                    <input class="form-control" id="edit_name" placeholder="Name">
                    <input class="form-control" id="edit_year" placeholder="Passout Year">
                    <input class="form-control" id="edit_email" placeholder="Email">
                    <input class="form-control" id="edit_ritemail" placeholder="RIT Email">
                    <input class="form-control" id="edit_contact" placeholder="Contact">
                    <input class="form-control" id="edit_password" readonly placeholder="Default Password">
                    <br>
                    <div class="action-btns">
                        <button class="btn btn-warning" onclick="updateUser()">Update</button>
                        <button class="btn btn-danger" onclick="deleteUser()">Delete</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
let currentUserID = "";

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

//======================== ADD USER =======================//
document.getElementById("userForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const response = await fetch("/add-user", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({
            ktu_id: document.getElementById("ktu_id").value,
            name: document.getElementById("name").value,
            passout_year: document.getElementById("passout_year").value,
            email: document.getElementById("email").value,
            ritemail: document.getElementById("ritemail").value,
            contact: document.getElementById("contact").value
        })
    });
    const data = await response.json();
    if (response.ok) {
        document.getElementById("message").innerHTML = `
            <div class="alert alert-success">
                ${data.message}<br>
                <b>Default Password :</b> ${data.default_password}
            </div>`;
        document.getElementById("userForm").reset();
    } else {
        document.getElementById("message").innerHTML = `
            <div class="alert alert-danger">
                ${data.message}
            </div>`;
    }
});

//======================== SEARCH =======================//
async function searchUser() {
    const ktu = document.getElementById("searchKTU").value;
    if (ktu == "") {
        alert("Enter KTU ID");
        return;
    }
    const response = await fetch("/search-user/" + ktu);
    const data = await response.json();
    if (!response.ok) {
        alert(data.message);
        return;
    }
    currentUserID = data.id;
    document.getElementById("edit_ktu").value = data.ktu_id;
    document.getElementById("edit_name").value = data.name;
    document.getElementById("edit_year").value = data.passout_year;
    document.getElementById("edit_email").value = data.email;
    document.getElementById("edit_ritemail").value = data.ritemail;
    document.getElementById("edit_contact").value = data.contact;
    document.getElementById("edit_password").value = data.savedpassword;
}

//======================== UPDATE =======================//
async function updateUser() {
    if (currentUserID == "") {
        alert("Search a user first");
        return;
    }
    const response = await fetch("/update-user/" + currentUserID, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({
            name: document.getElementById("edit_name").value,
            passout_year: document.getElementById("edit_year").value,
            email: document.getElementById("edit_email").value,
            ritemail: document.getElementById("edit_ritemail").value,
            contact: document.getElementById("edit_contact").value
        })
    });
    const data = await response.json();
    alert(data.message);
}

//======================== DELETE =======================//
async function deleteUser() {
    if (currentUserID == "") {
        alert("Search a user first");
        return;
    }
    if (!confirm("Delete this user?")) return;
    const response = await fetch("/delete-user/" + currentUserID, {
        method: "DELETE",
        headers: {
            "X-CSRFToken": getCookie("csrftoken")
        }
    });
    const data = await response.json();
    alert(data.message);
    location.reload();
}
</script>

</body>
</html>
