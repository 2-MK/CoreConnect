<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ fund.title }}</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        .header {
            background: white;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 25px;
            color: #222;
        }

        .back-btn {
            text-decoration: none;
            background: #333;
            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 14px;
        }

        .back-btn:hover {
            background: #111;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .fund-info {
            background: white;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;
        }

        .fund-info h2 {
            font-size: 30px;
            color: #222;
            margin-bottom: 15px;
        }

        .fund-info p {
            color: #666;
            line-height: 1.7;
            font-size: 16px;
        }

        .file-section {
            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .file-section h3 {
            margin-bottom: 20px;
            color: #222;
        }

        .file-viewer {
            width: 100%;
            height: 750px;

            border: 1px solid #ddd;

            border-radius: 10px;

            background: #f8f8f8;
        }

        .download-container {
            margin-top: 20px;
            text-align: center;
        }

        .download-btn {
            display: inline-block;

            text-decoration: none;

            background: #2563eb;
            color: white;

            padding: 12px 22px;

            border-radius: 8px;

            font-size: 15px;
        }

        .download-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .header {
                padding: 15px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                margin-top: 20px;
            }

            .fund-info {
                padding: 20px;
            }

            .fund-info h2 {
                font-size: 24px;
            }

            .file-viewer {
                height: 500px;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h1>Fund Details</h1>

        <a
            href="{% url 'view_fund' %}"
            class="back-btn"
        >
            ← Back to Funds
        </a>

    </div>


    <div class="container">


        <!-- FUND INFORMATION -->

        <div class="fund-info">

            <h2>
                {{ fund.title }}
            </h2>


            <p>

                {% if fund.description %}

                    {{ fund.description }}

                {% else %}

                    No description available.

                {% endif %}

            </p>

        </div>


        <!-- FILE -->

        <div class="file-section">

            <h3>
                Fund Document
            </h3>


            <iframe
                src="{{ fund.file_url }}"
                class="file-viewer"
                title="{{ fund.title }}"
            >
            </iframe>


            <div class="download-container">

                <a
                    href="{{ fund.file_url }}"
                    target="_blank"
                    class="download-btn"
                >
                    Open / Download File
                </a>

            </div>

        </div>


    </div>


</body>

</html>
