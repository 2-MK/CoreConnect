
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login | Core Connect</title>

    <link rel="stylesheet" href="{% static 'corecss/password_login.css' %}">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <div class="logo">
                <span>CC</span>
            </div>

            <!-- Heading -->
            <div class="login-header">
                <h2>User Login</h2>
                <p>Sign in to access your Core Connect account</p>
            </div>

            <!-- Error Message -->
            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label for="ktu_id">KTU ID</label>

                    <input
                        type="text"
                        id="ktu_id"
                        name="ktu_id"
                        placeholder="Enter your KTU ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                    <span>→</span>
                </button>

            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Core Connect &copy; 2026</p>
                <span>Student Association Portal</span>
            </div>

        </div>

    </div>

</body>
</html>
```
