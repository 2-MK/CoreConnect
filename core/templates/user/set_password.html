<!DOCTYPE html>
<html>
<head>
    <title>Create Password</title>
</head>
<body>

<h2>Create Password</h2>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
    >

    <br><br>

    <button type="submit">
        Save Password
    </button>

</form>

</body>
</html>
